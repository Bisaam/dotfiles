add_newline = false

palette = 'nord'

format = '[┌──\(](blue)$username[@](purple)$hostname[\)-\[](blue)$directory[\]](blue)$line_break[└─](blue)$character'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'blue'
style_root = 'red'

[hostname]
ssh_only = false
format = '[$hostname]($style)'
style = 'green'

[directory]
format = '[$path]($style)'
style = 'green'
home_symbol = '~'
truncation_length = 0

[character]
success_symbol = '[\$](text)'
error_symbol = '[\$](red)'
vimcmd_symbol = '[\$](text)'

[palettes.nord]
red = '#bf616a'     # nord11
green = '#a3be8c'   # nord14
blue = '#81a1c1'    # nord9
purple = '#b48ead'  # nord15
text = '#d8dee9'    # nord4
