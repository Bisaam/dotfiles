#Plugins
# Tmux Catppuccin theme
#  run $HOME/dotfiles/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# Custom Status Bar
   set -g @tmux-dotbar-bg "#1e1e2e"
   set -g @tmux-dotbar-fg "#6c7086"
   set -g @tmux-dotbar-fg-current "#89b4fa"
   set -g @tmux-dotbar-fg-session "#6c7086"
   set -g @tmux-dotbar-fg-prefix "#cba6f7"
   run $HOME/dotfiles/tmux/plugins/tmux-dotbar/dotbar.tmux

# Catppuccin Mocha colors for everything the status bar doesn't cover
   # messages and the command prompt (prefix + :)
   set -g message-style "bg=#313244,fg=#cdd6f4,fill=#313244"
   set -g message-command-style "bg=#313244,fg=#89b4fa,fill=#313244"
   # copy mode, choose-tree, etc.
   set -g mode-style "bg=#45475a,fg=#cdd6f4"
   set -g copy-mode-match-style "bg=#f9e2af,fg=#1e1e2e"
   set -g copy-mode-current-match-style "bg=#fab387,fg=#1e1e2e"
   set -g copy-mode-mark-style "bg=#f38ba8,fg=#1e1e2e"
   # pane borders (active: yellow in copy mode, red when panes are synced, blue otherwise)
   set -g pane-border-style "fg=#313244"
   set -g pane-active-border-style "#{?pane_in_mode,fg=#f9e2af,#{?synchronize-panes,fg=#f38ba8,fg=#89b4fa}}"
   # menus and popups
   set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
   set -g menu-selected-style "bg=#313244,fg=#89b4fa,bold"
   set -g menu-border-style "fg=#6c7086"
   set -g popup-border-style "fg=#6c7086"
   # prefix + q pane numbers, prefix + t clock
   set -g display-panes-colour "#6c7086"
   set -g display-panes-active-colour "#89b4fa"
   setw -g clock-mode-colour "#89b4fa"

# Change the default prefix
   set -g prefix C-a
   unbind-key C-b
   bind-key C-a send-prefix
  
# Enable mouse support
   set -g mouse on

# True colors (24-bit) from iTerm2, so vim/fzf/etc. show exact hex colors
   set -as terminal-features ",xterm-256color:RGB"

# Allow image escape sequences (e.g. fastfetch logos) to pass through to iTerm2
   set -g allow-passthrough on

# Vim-style pane navigation
   bind h select-pane -L
   bind j select-pane -D
   bind k select-pane -U
   bind l select-pane -R
