#Plugins
# Tmux Catppuccin theme
#  run $HOME/dotfiles/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# Custom Status Bar
   # "default" bg lets iTerm2's window transparency show through the bar
   set -g @tmux-dotbar-bg "default"
   set -g @tmux-dotbar-fg "#616e88"
   set -g @tmux-dotbar-fg-current "#88c0d0"
   set -g @tmux-dotbar-fg-session "#616e88"
   set -g @tmux-dotbar-fg-prefix "#88c0d0"
   run $HOME/dotfiles/tmux/plugins/tmux-dotbar/dotbar.tmux
   # the plugin reuses bg as the text color on highlights, so keep that text dark
   run 'tmux set -g status-left "$(tmux show -gv status-left | sed "s/fg=default,bold/fg=##2e3440,bold/")"'
   set -g window-status-bell-style "bg=#b48ead,fg=#2e3440,bold"
   set -g window-status-activity-style "bg=#88c0d0,fg=#2e3440"

# Nord colors for everything the status bar doesn't cover
   # messages and the command prompt (prefix + :)
   set -g message-style "bg=#3b4252,fg=#d8dee9,fill=#3b4252"
   set -g message-command-style "bg=#3b4252,fg=#88c0d0,fill=#3b4252"
   # copy mode, choose-tree, etc. (same selection color as iTerm)
   set -g mode-style "bg=#4c566a,fg=#eceff4"
   set -g copy-mode-match-style "bg=#ebcb8b,fg=#2e3440"
   set -g copy-mode-current-match-style "bg=#d08770,fg=#2e3440"
   set -g copy-mode-mark-style "bg=#bf616a,fg=#2e3440"
   # pane borders (active: yellow in copy mode, red when panes are synced, frost otherwise)
   set -g pane-border-style "fg=#3b4252"
   set -g pane-active-border-style "#{?pane_in_mode,fg=#ebcb8b,#{?synchronize-panes,fg=#bf616a,fg=#88c0d0}}"
   # menus and popups
   set -g menu-style "bg=#2e3440,fg=#d8dee9"
   set -g menu-selected-style "bg=#3b4252,fg=#88c0d0,bold"
   set -g menu-border-style "fg=#4c566a"
   set -g popup-border-style "fg=#4c566a"
   # prefix + q pane numbers, prefix + t clock
   set -g display-panes-colour "#616e88"
   set -g display-panes-active-colour "#88c0d0"
   setw -g clock-mode-colour "#88c0d0"

# Change the default prefix
   set -g prefix C-a
   unbind-key C-b
   bind-key C-a send-prefix
  
# Enable mouse support
   set -g mouse on
   # scroll 2 lines per wheel tick instead of tmux's default 5
   bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
   bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
   bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
   bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# True colors (24-bit) from iTerm2, so vim/fzf/etc. show exact hex colors
   set -as terminal-features ",xterm-256color:RGB"

# Pass modified keys (e.g. Shift+Enter for a newline in Claude Code) through to apps
   set -s extended-keys always
   set -s extended-keys-format csi-u
   set -as terminal-features ",xterm*:extkeys"

# Allow image escape sequences (e.g. fastfetch logos) to pass through to iTerm2
   set -g allow-passthrough on

# Vim-style pane navigation
   bind h select-pane -L
   bind j select-pane -D
   bind k select-pane -U
   bind l select-pane -R
