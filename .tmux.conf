#Plugins
# Tmux Catppuccin theme
#  run $HOME/dotfiles/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# Custom Status Bar
   set -g @tmux-dotbar-bg "#1E1E2F"
   run $HOME/dotfiles/tmux/plugins/tmux-dotbar/dotbar.tmux

# Change the default prefix
   set -g prefix C-a
   unbind-key C-b
   bind-key C-a send-prefix
  
# Enable mouse support
   set -g mouse on

# Allow image escape sequences (e.g. fastfetch logos) to pass through to iTerm2
   set -g allow-passthrough on

# Vim-style pane navigation
   bind h select-pane -L
   bind j select-pane -D
   bind k select-pane -U
   bind l select-pane -R
